[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "fastapi>=0.141.1",
    "google-genai>=2.16.0",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pypdf>=5.1.0",
    "python-dotenv>=1.2.2",
    "rich>=13.9.4",
    "ruff>=0.16.1",
    "uvicorn[standard]>=0.52.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
